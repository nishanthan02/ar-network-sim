<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>Phase 2 - Network Topology</title>
    <!-- Core A-Frame and AR.js Libraries -->
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  </head>
  <body style="margin: 0; overflow: hidden;">
    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;">
      <a-marker preset="hiro" smooth="true" smoothCount="10">
        
        <!-- 1. Physical Ethernet Cable (Gray line connecting all nodes) -->
        <a-entity line="start: -1.2 0.15 0; end: 1.2 0.15 0; color: #7f8c8d"></a-entity>

        <!-- 2. Client Workstation (Blue Box) -->
        <a-box position="-1.2 0.2 0" scale="0.35 0.35 0.35" color="#3498db"></a-box>
        <a-text 
          value="Client PC\n192.168.1.50" 
          position="-1.2 0.55 0" 
          scale="0.35 0.35 0.35" 
          align="center" 
          color="#ffffff"
          material="side: double">
        </a-text>

        <!-- 3. Gateway Firewall (Green Barrier Disc) -->
        <a-cylinder 
          id="firewall-mesh" 
          position="0 0.2 0" 
          scale="0.08 0.45 0.45" 
          rotation="0 0 90" 
          color="#2ecc71">
        </a-cylinder>
        <a-text 
          id="firewall-text" 
          value="Firewall\n[ALLOW ALL]" 
          position="0 0.55 0" 
          scale="0.35 0.35 0.35" 
          align="center" 
          color="#ffffff"
          material="side: double">
        </a-text>

        <!-- 4. Web Server (Purple Server Rack Cylinder) -->
        <a-cylinder position="1.2 0.25 0" scale="0.25 0.5 0.25" color="#9b59b6"></a-cylinder>
        <a-text 
          value="Web Server\n10.0.0.8" 
          position="1.2 0.65 0" 
          scale="0.35 0.35 0.35" 
          align="center" 
          color="#ffffff"
          material="side: double">
        </a-text>

      </a-marker>

      <a-entity camera></a-entity>
    </a-scene>
  </body>
</html>
