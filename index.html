<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>AR Network Packet Simulator - Phase 4</title>
    <!-- Core A-Frame and AR.js Libraries -->
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

    <style>
      body {
        margin: 0;
        overflow: hidden;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        user-select: none;
      }

      /* Top HUD Status Bar */
      #status-card {
        position: fixed;
        top: 18px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 1000;
        background: rgba(15, 23, 42, 0.92);
        color: #38bdf8;
        padding: 9px 18px;
        border-radius: 20px;
        font-family: monospace;
        font-size: 13px;
        font-weight: bold;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
        text-align: center;
        width: 85%;
        max-width: 340px;
        pointer-events: none;
      }

      /* Bottom HUD Controls */
      #ui-controls {
        position: fixed;
        bottom: 25px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 1000;
        display: flex;
        gap: 12px;
        background: rgba(15, 23, 42, 0.88);
        padding: 10px 18px;
        border-radius: 30px;
        backdrop-filter: blur(8px);
      }

      button {
        padding: 10px 18px;
        border: none;
        border-radius: 20px;
        font-weight: 700;
        font-size: 13px;
        cursor: pointer;
        transition: transform 0.1s ease;
      }
      button:active {
        transform: scale(0.95);
      }

      #btn-send { background: #38bdf8; color: #0f172a; }
      #btn-firewall { background: #22c55e; color: #ffffff; }

      /* OSI Header Inspector Modal */
      #inspector-modal {
        display: none;
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        z-index: 2000;
        width: 86%;
        max-width: 350px;
        background: #0f172a;
        color: #f8fafc;
        border-radius: 14px;
        padding: 18px;
        box-shadow: 0 20px 30px rgba(0, 0, 0, 0.7);
        border: 1px solid #334155;
      }

      .modal-title {
        font-size: 15px;
        font-weight: 700;
        margin: 0 0 12px 0;
        color: #38bdf8;
        display: flex;
        align-items: center;
        gap: 6px;
      }

      .layer-block {
        background: #1e293b;
        padding: 8px 10px;
        border-radius: 6px;
        margin-bottom: 8px;
        font-size: 12px;
        border-left: 3px solid #38bdf8;
      }

      .layer-block b {
        color: #94a3b8;
        display: block;
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        margin-bottom: 2px;
      }

      .layer-block span {
        font-family: monospace;
        color: #f1f5f9;
      }

      #btn-resume {
        width: 100%;
        margin-top: 10px;
        background: #38bdf8;
        color: #0f172a;
        padding: 10px 0;
        font-size: 13px;
        font-weight: 700;
      }
    </style>
  </head>

  <body>
    <div id="status-card">Status: Network Idle</div>

    <div id="ui-controls">
      <button id="btn-send" onclick="sendPacket()">Send Packet</button>
      <button id="btn-firewall" onclick="toggleFirewall()">Firewall: ALLOW</button>
    </div>

    <!-- OSI Inspector Popup Window -->
    <div id="inspector-modal">
      <div class="modal-title">🔍 OSI Packet Encapsulation</div>
      
      <div class="layer-block" style="border-color: #a855f7;">
        <b>Layer 7 (Application)</b>
        <span>Payload: GET /index.html HTTP/1.1</span>
      </div>

      <div class="layer-block" style="border-color: #38bdf8;">
        <b>Layer 4 (Transport)</b>
        <span>Protocol: TCP | Port: 80 | Flag: [SYN]</span>
      </div>

      <div class="layer-block" style="border-color: #22c55e;">
        <b>Layer 3 (Network)</b>
        <span>Src: 192.168.1.50 → Dst: 10.0.0.8</span>
      </div>

      <div class="layer-block" style="border-color: #f59e0b;">
        <b>Layer 2 (Data Link)</b>
        <span>MAC: 3C:5A:B4:72:01 → B2:11:F9:64</span>
      </div>

      <button id="btn-resume" onclick="resumePacket()">Resume Transit</button>
    </div>

    <!-- A-Frame AR Scene with Mouse/Touch Raycaster -->
    <a-scene 
      embedded 
      arjs="sourceType: webcam; debugUIEnabled: false;" 
      cursor="rayOrigin: mouse" 
      raycaster="objects: .clickable">
      
      <a-marker preset="hiro" smooth="true" smoothCount="10">
        <!-- Physical Ethernet Wire -->
        <a-entity line="start: 0 0.15 -1.2; end: 0 0.15 1.2; color: #94a3b8"></a-entity>

        <!-- 1. Client Node (Rotated coordinates so text aligns naturally upright) -->
        <a-box position="0 0.2 -1.2" scale="0.35 0.35 0.35" color="#38bdf8"></a-box>
        <a-text 
          value="Client PC\n192.168.1.50" 
          position="0 0.6 -1.2" 
          rotation="-90 0 0"
          scale="0.35 0.35 0.35" 
          align="center" 
          color="#ffffff"
          material="side: double">
        </a-text>

        <!-- 2. Firewall Node -->
        <a-cylinder 
          id="firewall-mesh" 
          position="0 0.2 0" 
          scale="0.45 0.08 0.45" 
          color="#22c55e">
        </a-cylinder>
        <a-text 
          id="firewall-label" 
          value="Firewall\n[ALLOW]" 
          position="0 0.45 0" 
          rotation="-90 0 0"
          scale="0.35 0.35 0.35" 
          align="center" 
          color="#ffffff"
          material="side: double">
        </a-text>

        <!-- 3. Web Server Node -->
        <a-cylinder position="0 0.25 1.2" scale="0.25 0.5 0.25" color="#a855f7"></a-cylinder>
        <a-text 
          value="Web Server\n10.0.0.8" 
          position="0 0.65 1.2" 
          rotation="-90 0 0"
          scale="0.35 0.35 0.35" 
          align="center" 
          color="#ffffff"
          material="side: double">
        </a-text>

        <!-- 4. Interactive Packet (Tagged as .clickable for raycasting) -->
        <a-sphere 
          id="packet" 
          class="clickable" 
          position="0 0.2 -1.2" 
          radius="0.14" 
          color="#facc15" 
          visible="false">
        </a-sphere>

      </a-marker>

      <a-entity camera></a-entity>
    </a-scene>

    <script>
      let firewallBlockActive = false;
      let isTransmitting = false;
      let isPaused = false;
      let posZ = -1.2;
      let animFrameId = null;

      function updateStatus(text, color = "#38bdf8") {
        const card = document.getElementById("status-card");
        card.innerText = text;
        card.style.color = color;
      }

      function toggleFirewall() {
        firewallBlockActive = !firewallBlockActive;
        const btn = document.getElementById("btn-firewall");
        const mesh = document.getElementById("firewall-mesh");
        const label = document.getElementById("firewall-label");

        if (firewallBlockActive) {
          btn.innerText = "Firewall: BLOCK (Port 80)";
          btn.style.background = "#ef4444";
          mesh.setAttribute("color", "#ef4444");
          label.setAttribute("value", "Firewall\n[BLOCK PORT 80]");
        } else {
          btn.innerText = "Firewall: ALLOW";
          btn.style.background = "#22c55e";
          mesh.setAttribute("color", "#22c55e");
          label.setAttribute("value", "Firewall\n[ALLOW]");
        }
      }

      function sendPacket() {
        if (isTransmitting) return;
        isTransmitting = true;
        isPaused = false;
        posZ = -1.2;

        const packet = document.getElementById("packet");
        packet.setAttribute("position", `0 0.2 ${posZ}`);
        packet.setAttribute("color", "#facc15");
        packet.setAttribute("visible", "true");
        updateStatus("Transmitting: Tap golden packet to inspect headers!", "#facc15");

        stepAnimation();
      }

      function stepAnimation() {
        if (isPaused) return;

        posZ += 0.015;
        const packet = document.getElementById("packet");
        packet.setAttribute("position", `0 0.2 ${posZ}`);

        // Hit Firewall
        if (posZ >= -0.05 && posZ <= 0.05 && firewallBlockActive) {
          packet.setAttribute("color", "#ef4444");
          updateStatus("403 Forbidden: Dropped by Firewall Rule!", "#ef4444");
          concludeTransmission(2000);
          return;
        }

        // Hit Server
        if (posZ >= 1.2) {
          packet.setAttribute("color", "#22c55e");
          updateStatus("HTTP 200 OK: Reached Server!", "#22c55e");
          concludeTransmission(2000);
          return;
        }

        animFrameId = requestAnimationFrame(stepAnimation);
      }

      // Tap / Click detection on the 3D packet
      document.getElementById("packet").addEventListener("click", () => {
        if (!isTransmitting || isPaused) return;
        isPaused = true;
        cancelAnimationFrame(animFrameId);
        document.getElementById("inspector-modal").style.display = "block";
        updateStatus("Packet Frozen: Inspecting OSI Headers", "#38bdf8");
      });

      function resumePacket() {
        document.getElementById("inspector-modal").style.display = "none";
        isPaused = false;
        updateStatus("Resuming Transit...", "#facc15");
        stepAnimation();
      }

      function concludeTransmission(delay) {
        setTimeout(() => {
          document.getElementById("packet").setAttribute("visible", "false");
          isTransmitting = false;
          updateStatus("Status: Network Idle", "#38bdf8");
        }, delay);
      }
    </script>
  </body>
</html>
